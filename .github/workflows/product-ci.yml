# docket PRODUCT CI — the product's own build + tests (R15: governance runs in
# its own pipeline; see governance.yml).
name: product-ci
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
