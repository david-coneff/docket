# docket PRODUCT CI — the product's own build + tests (R15: governance runs in
# its own pipeline; see governance.yml).
#
# Runs on BOTH branches of the two-branch model (rhiz-child-repo-convention.md#55):
# rhiz-working, so real changes are validated before promotion, AND main, as the
# safety net that the PROMOTED (artifact-stripped) tree still builds — a real check
# that stripping never silently broke something, not just an assumption.
name: product-ci
on:
  push:
    branches: [main, rhiz-working, "claude/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
