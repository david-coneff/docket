# docket GOVERNANCE pipeline — R15: rhizome governance runs OUTSIDE the product CI.
#
# Checks out three roots (product + protocol + docket-memory) and runs the
# mechanical maintenance loop against them. The product repo carries only a thin
# .rhiz-binding.json; its curated notes and baselines live in docket-memory, so
# this is the only pipeline that needs all three.
name: governance

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docket

      # Where the protocol and memory live is READ FROM THE COMMITTED BINDING,
      # never written as a literal here (protocol-instance-split principle 3: a
      # fork must be swappable by editing config, not code — a hardcoded
      # `owner/repo` makes this workflow un-adoptable by anyone else). The
      # binding is already on disk from the checkout above, and
      # `.rhiz-binding.json` is the designated home for a coordinate.
      - name: Resolve roots from the binding
        id: binding
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          b = json.load(open("docket/.rhiz-binding.json"))
          slug = lambda u: re.sub(r"^https?://[^/]+/|\.git$", "", u)
          print(f"protocol_repo={slug(b['protocol_url'])}")
          print(f"protocol_ref={b.get('protocol_ref', 'main')}")
          print(f"memory_repo={slug(b['memory_url'])}")
          print(f"memory_ref={b.get('memory_ref', 'main')}")
          PY

      # Both are PRIVATE, so these checkouts need a read credential: a
      # fine-grained PAT with read access, stored as RHIZOME_TOOLS_TOKEN.
      - name: Check out the protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.binding.outputs.protocol_repo }}
          ref: ${{ steps.binding.outputs.protocol_ref }}
          path: rhizome-protocol
          token: ${{ secrets.RHIZOME_TOOLS_TOKEN || github.token }}

      - name: Check out the memory repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.binding.outputs.memory_repo }}
          ref: ${{ steps.binding.outputs.memory_ref }}
          path: docket-memory
          token: ${{ secrets.RHIZOME_TOOLS_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Protocol pin drift-guard
        working-directory: docket
        run: |
          PINNED=$(python3 -c "import json;print(json.load(open('.rhiz-binding.json'))['protocol_sha'])")
          ACTUAL=$(git -C ../rhizome-protocol rev-parse HEAD)
          if [ "$PINNED" != "$ACTUAL" ]; then
            echo "::notice::protocol pin $PINNED lags main $ACTUAL — bump .rhiz-binding.json when ready"
          fi

      - name: Mechanical maintenance (multi-root)
        working-directory: docket
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
          RHIZ_MEMORY_PATH: ${{ github.workspace }}/docket-memory
        run: python3 tools/rhiz.py maintain

      # The memory repo lints on ITS OWN root — rhiz-lint stays product-local and
      # never reaches across a repo boundary, so a clone without the sibling is not
      # silently under-governed (EL-152). Reuses the checkout above rather than
      # adding a workflow to docket-memory. Its .rhiz-lint.json declares
      # knowledge_roots ["."], which is what this invocation expects.
      - name: Lint docket-memory on its own root
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: python3 rhizome-protocol/tools/rhiz-lint.py --root docket-memory

      # The reference half of the same boundary: lint validates docket-memory
      # INTERNALLY, this validates what it says about OTHER repos — protocol
      # paths against the live protocol tree, and `<repo>:<path>` coordinates
      # against whichever siblings this workflow checked out. Coordinates naming
      # a repo that is not checked out are SKIPPED, not failed, so the verdict
      # does not depend on which repos a given job happens to clone.
      - name: Cross-repo reference check on docket-memory
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: |
          python3 rhizome-protocol/tools/rhiz-lint.py \
            --root rhizome-protocol --cross-repo docket-memory

      - name: Shareability gate on docket-memory
        env:
          RHIZ_TOOLS_PATH: ${{ github.workspace }}/rhizome-protocol
        run: |
          # The PRODUCT root, audited first. Path is the checkout dir, not `.`:
          # this step has no working-directory, so it runs from the workspace. This is where the coordinate leaks
          # actually were — all 8 children hardcoded the protocol repo in this
          # very file — and until now no pipeline anywhere scanned a product
          # root, so the principle-3 guard was pointed away from its target.
          python3 rhizome-protocol/tools/rhiz_scope_audit.py --root docket
          python3 rhizome-protocol/tools/rhiz_scope_audit.py --root docket-memory
          if find docket-memory -type f ! -path '*/.git/*' \
               | grep -iE '\.(png|jpg|jpeg|gif|webp|wasm|zip|bin|mp4|webm|pdf)$'; then
            echo "::error::blob found in the shareable notes repo — must live in a private -lfs"
            exit 1
          fi
